[project]
name = "mini-agent"
version = "0.1.0"
description = "一个最小但完整的 AI Agent：Model + State + Tools + Control Loop + Memory/Evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "ddgs>=9.0",          # 免 key 的网页检索后端（DuckDuckGo）
]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
