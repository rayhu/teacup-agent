[project]
name = "teacup-agent"
version = "0.1.0"
description = "A minimal but complete AI agent, easy to fork, improve and share: Model + State + Tools + Control Loop + Memory/Evals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ray Hu" }]
keywords = ["ai-agent", "llm", "agentic-ai", "mcp", "model-context-protocol", "openai", "a2a", "agent2agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "ddgs>=9.0", # key-less web search backend (DuckDuckGo)
    "mcp>=2.1", # MCP client (SDK v2, speaks the 2026-07-28 stateless spec)
    "pyyaml>=6.0", # parses agent.yaml (a real nested document, unlike skills' frontmatter)
    "a2a-sdk>=1.1.2", # Agent2Agent client (httpx is a hard dep of it; no [http-server] extra needed here)
]

[project.urls]
Homepage = "https://github.com/rayhu/teacup-agent"
Repository = "https://github.com/rayhu/teacup-agent"
Roadmap = "https://github.com/rayhu/teacup-agent/blob/main/docs/roadmap.md"

[project.scripts]
teacup-agent = "teacup_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teacup_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
